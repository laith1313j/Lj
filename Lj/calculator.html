<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة علمية Casio fx-991EX Style</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.3.0/math.js"></script>

    <style>
        /* التنسيقات المضافة من المشروع الرئيسي (لشريط العنوان ورابط العودة) */
        :root {
            --header-bg-color: #1a1a2e;
            --header-text-color: #ffffff;
            --primary-color: #007bff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f5;
            margin: 0;
            display: flex;
            justify-content: flex-start; /* تغيير إلى start لترك مساحة للشريط العلوي */
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            width: 100%; /* مهم لظهور الشريط كاملاً */
        }
        
        /* شريط العنوان الرئيسي الموحد */
        .main-header {
            width: 100%;
            background-color: var(--header-bg-color);
            color: var(--header-text-color);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .main-header h1 {
            margin: 0;
            font-size: 2.5rem;
            /* ظل النص الجمالي */
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8), 
                         0 0 10px rgba(0, 123, 255, 0.5); 
            color: #fff;
        }
        
        /* رابط العودة - أصبح فوق الآلة الحاسبة */
        .back-link {
            margin-bottom: 20px;
            text-decoration: none;
            color: var(--primary-color); /* استخدام لون موحد */
            font-size: 1.1rem;
            font-weight: bold;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: #0056b3;
        }


        /* تنسيقات الآلة الحاسبة العلمية الأصلية */
        .calculator {
            border: 1px solid #ddd;
            border-radius: 12px;
            width: 450px; /* عرض مناسب للحاسبة العلمية */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            background-color: #fff;
            padding: 15px;
            margin-bottom: 30px; /* لترك مسافة عن نهاية الشاشة */
        }

        /* شاشة العرض */
        .calculator-screen {
            width: 100%;
            height: 80px;
            background-color: #e0eee0;
            color: #333;
            text-align: right;
            padding: 10px;
            font-size: 1.4rem;
            border: 1px solid #aaa;
            box-sizing: border-box;
            border-radius: 8px;
            margin-bottom: 15px;
            direction: ltr; 
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        
        #expression {
            font-size: 1.5rem;
            min-height: 25px;
        }

        #result {
            font-size: 1.8rem;
            font-weight: bold;
            color: #004d99;
            min-height: 25px;
        }

        .calculator-keys {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 8px;
        }

        button {
            height: 55px;
            background-color: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1.1rem;
            color: #333;
            cursor: pointer;
            transition: background-color 0.1s;
            font-weight: 600;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        /* أزرار الوظائف العلمية */
        .scientific-key {
            background-color: #ff9800;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
        }
        
        .scientific-key:hover {
            background-color: #fb8c00;
        }

        /* الأزرار العلوية */
        .top-key {
            background-color: #607d8b;
            color: white;
            font-size: 0.9rem;
        }
        
        .top-key:hover {
            background-color: #78909c;
        }

        /* العمليات الأساسية */
        .operator {
            background-color: #4caf50;
            color: white;
        }
        
        .operator:hover {
            background-color: #66bb6a;
        }

        /* أزرار المسح والـ AC */
        .control-key {
            background-color: #f44336;
            color: white;
        }
        
        .control-key:hover {
            background-color: #e57373;
        }

        /* زر يساوي */
        .equal-sign {
            background-color: #00bcd4;
            color: white;
            font-size: 1.5rem;
        }
        
        .equal-sign:hover {
            background-color: #26c6da;
        }
        
        .zero-button {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    
    <div class="main-header">
        <h1>الآلة الحاسبة العلمية 🔢</h1>
    </div>

    <a href="index.html" class="back-link">العودة إلى القائمة الرئيسية</a>

    <div class="calculator">
        <div class="calculator-screen">
            <div id="expression"></div>
            <div id="result">0</div>
        </div>
        
        <div class="calculator-keys">
            
            <button class="top-key" value="shift">SHIFT</button>
            <button class="top-key" value="alpha">ALPHA</button>
            <button class="scientific-key" value="mode">MODE</button>
            <button class="control-key" value="delete">DEL</button>
            <button class="control-key" value="all-clear">AC</button>
            
            <button class="scientific-key" value="sin(">sin</button>
            <button class="scientific-key" value="cos(">cos</button>
            <button class="scientific-key" value="tan(">tan</button>
            <button class="scientific-key" value="^">xʸ</button>
            <button class="scientific-key" value="sqrt(">√</button>

            <button class="scientific-key" value="log(">log</button>
            <button class="scientific-key" value="ln(">ln</button>
            <button class="scientific-key" value="exp">eˣ</button>
            <button class="scientific-key" value="(">(</button>
            <button class="scientific-key" value=")">)</button>
            
            <button value="7">7</button>
            <button value="8">8</button>
            <button value="9">9</button>
            <button class="operator" value="/">÷</button>
            <button class="operator" value="*">&times;</button>

            <button value="4">4</button>
            <button value="5">5</button>
            <button value="6">6</button>
            <button class="operator" value="-">-</button>
            <button class="operator" value="+">+</button>

            <button value="1">1</button>
            <button value="2">2</button>
            <button value="3">3</button>
            <button value="pi">π</button>
            <button value="e">e</button>

            <button class="zero-button" value="0">0</button>
            <button class="decimal" value=".">.</button>
            <button class="equal-sign" value="=">=</button>
        </div>
    </div>
    
    <script>
        let expressionDisplay = document.getElementById('expression');
        let resultDisplay = document.getElementById('result');
        let currentExpression = '';
        let isResultDisplayed = false;

        function updateDisplays() {
            // استبدال الرموز البرمجية بالرموز الرياضية للعرض
            expressionDisplay.textContent = currentExpression
                .replace(/\*/g, '×')
                .replace(/\//g, '÷')
                .replace(/\^/g, 'ˣ');
        }

        function appendInput(value) {
            if (isResultDisplayed) {
                // إذا كانت الشاشة تعرض نتيجة، ابدأ بتعبير جديد إلا إذا كان المدخل عملية حسابية
                if (!['+', '-', '*', '/', '^', '(', ')'].includes(value)) {
                    currentExpression = '';
                }
                isResultDisplayed = false;
            }
            
            // التعامل مع الثوابت الرياضية (π و e)
            if (value === 'pi') {
                 currentExpression += 'pi';
            } else if (value === 'e') {
                 currentExpression += 'e';
            }
            // التعامل مع الأصفار الابتدائية
            else if (currentExpression === '' && value === '0') {
                 return;
            }
            // التعامل مع الإدخال العادي
            else {
                currentExpression += value;
            }
            
            resultDisplay.textContent = ''; // مسح خانة النتيجة عند إدخال جديد
            updateDisplays();
        }

        function calculate() {
            if (currentExpression === '') return;
            
            try {
                // استخدام Math.js لتقييم التعبير
                let result = math.evaluate(currentExpression);
                
                if (typeof result === 'number' && !isFinite(result)) {
                    resultDisplay.textContent = 'Error';
                } else {
                    // عرض النتيجة
                    resultDisplay.textContent = String(result);
                    // تحديث التعبير إلى النتيجة استعداداً للعملية التالية
                    currentExpression = String(result); 
                }
                isResultDisplayed = true;
            } catch (e) {
                resultDisplay.textContent = 'Syntax Error';
                isResultDisplayed = true;
            }
            updateDisplays();
        }

        function resetCalculator() {
            currentExpression = '';
            resultDisplay.textContent = '0';
            isResultDisplayed = false;
            updateDisplays();
        }
        
        function deleteLast() {
            if (isResultDisplayed) return;
            currentExpression = currentExpression.slice(0, -1);
            if (currentExpression === '') {
                resultDisplay.textContent = '0';
            }
            updateDisplays();
        }

        // ربط الأزرار بالوظائف
        const keys = document.querySelector('.calculator-keys');
        keys.addEventListener('click', (event) => {
            const { target } = event;
            const { value } = target;

            if (!target.matches('button')) { return; }

            switch (value) {
                case '=':
                    calculate();
                    break;
                case 'all-clear':
                    resetCalculator();
                    break;
                case 'delete':
                    deleteLast();
                    break;
                case 'shift':
                case 'alpha':
                case 'mode':
                    // هذه الأزرار تحتاج إلى وظائف معقدة لتغيير الوضع غير مدعومة هنا
                    alert(`وظيفة ${value.toUpperCase()} تحتاج إلى تطوير متقدم لتغيير أوضاع الحاسبة.`);
                    break;
                default:
                    appendInput(value);
            }
        });
        
        // التهيئة الأولية
        updateDisplays();
    </script>
</body>
</html>
